  <script>
    lucide.createIcons();

    // ==========================================
    // TEMA OSCURO PARA SWEETALERT2
    // ==========================================
    function swalTheme() {
      return {
        buttonsStyling: false,
        customClass: {
          popup: '!bg-slate-900 !text-white !rounded-2xl !border !border-slate-800 !shadow-2xl',
          title: '!text-white !text-xl !font-bold',
          htmlContainer: '!text-slate-300 !text-sm',
          confirmButton: '!bg-indigo-600 hover:!bg-indigo-700 !text-white !px-5 !py-2 !rounded-lg !font-medium !transition-colors !ml-2',
          cancelButton: '!bg-slate-700 hover:!bg-slate-600 !text-white !px-5 !py-2 !rounded-lg !font-medium !transition-colors !mr-2',
          icon: '!border-0'
        }
      };
    }

    // ==========================================
    // SIDEBAR MÓVIL
    // ==========================================
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    }

    document.querySelectorAll('#sidebar nav a').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth < 1024) toggleSidebar();
      });
    });

    // ==========================================
    // CERRAR SESIÓN (patrón GASVEL + SweetAlert2)
    // ==========================================
    function cerrarSesion() {
      Swal.fire(Object.assign(swalTheme(), {
        icon: 'warning',
        title: '¿Cerrar sesión?',
        text: 'Volverás a la pantalla de inicio de sesión.',
        showCancelButton: true,
        confirmButtonText: 'Sí, cerrar sesión',
        cancelButtonText: 'Cancelar',
        reverseButtons: true
      })).then(function(result) {
        if (!result.isConfirmed) return;

        // Mostrar spinner mientras el servidor procesa
        Swal.fire(Object.assign(swalTheme(), {
          title: 'Cerrando sesión...',
          allowOutsideClick: false,
          allowEscapeKey: false,
          showConfirmButton: false,
          didOpen: function() { Swal.showLoading(); }
        }));

        google.script.run
          .withSuccessHandler(function(response) {
            var data = response;
            if (typeof response === 'string') {
              try { data = JSON.parse(response); } catch (e) { data = {}; }
            }
            var url = (data && data.url) ? data.url : '?p=login';
            window.top.location.href = url;
          })
          .withFailureHandler(function() {
            window.top.location.href = '?p=login';
          })
          .logout();
      });
    }
  </script>
