  <script>
    lucide.createIcons();

    // Tema oscuro para SweetAlert2 con clases Tailwind
    function swalTheme() {
      return {
        buttonsStyling: false,
        customClass: {
          popup: '!bg-slate-900 !text-white !rounded-2xl !border !border-slate-800 !shadow-2xl',
          title: '!text-white !text-xl !font-bold',
          htmlContainer: '!text-slate-300 !text-sm',
          confirmButton: '!bg-indigo-600 hover:!bg-indigo-700 !text-white !px-5 !py-2 !rounded-lg !font-medium !transition-colors !ml-2',
          cancelButton: '!bg-slate-700 hover:!bg-slate-600 !text-white !px-5 !py-2 !rounded-lg !font-medium !transition-colors !mr-2',
          icon: '!border-0'
        }
      };
    }

    function togglePassword() {
      var input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function hacerLogin() {
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var next = document.getElementById('loginNext').value;
      var btn = document.getElementById('btnLogin');

      if (!email || !password) {
        Swal.fire(Object.assign(swalTheme(), {
          icon: 'warning',
          title: 'Campos incompletos',
          text: 'Ingresa tu email y contraseña para continuar.'
        }));
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verificando...';

      google.script.run
        .withSuccessHandler(function(response) {
          btn.disabled = false;
          btn.textContent = 'Log in';

          var data = response;
          if (typeof response === 'string') {
            try { data = JSON.parse(response); } catch (e) { data = { success: false }; }
          }

          if (data && data.success) {
            Swal.fire(Object.assign(swalTheme(), {
              icon: 'success',
              title: '¡Bienvenido!',
              text: data.message || 'Sesión iniciada correctamente.',
              timer: 1200,
              showConfirmButton: false,
              timerProgressBar: true
            })).then(function() {
              window.top.location.href = data.url;
            });
          } else {
            Swal.fire(Object.assign(swalTheme(), {
              icon: 'error',
              title: 'Error de acceso',
              text: (data && data.message) ? data.message : 'Credenciales incorrectas.'
            }));
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = 'Log in';
          Swal.fire(Object.assign(swalTheme(), {
            icon: 'error',
            title: 'Error de conexión',
            text: err.message || 'No se pudo contactar al servidor.'
          }));
        })
        .login({ email: email, password: password, next: next });
    }
  </script>
