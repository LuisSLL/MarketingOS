<!DOCTYPE html>
<html lang="es" class="<?!= theme === 'dark' ? 'dark' : '' ?>">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><?= typeof title !== 'undefined' ? title : (typeof CONFIG !== 'undefined' ? CONFIG.APP_NAME : 'App') ?></title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            display: ['Space Grotesk', 'ui-sans-serif', 'system-ui']
          },
          colors: {
            brand: {
              50:  '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81'
            }
          }
        }
      }
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui; }
    .font-display { font-family: 'Space Grotesk', ui-sans-serif, system-ui; }
  </style>

  <script>
    const SCRIPT_URL = '<?= scriptUrl ?>';
    // Evita el parpadeo de tema (FOUC) antes de que cargue Tailwind.
    (function() {
      var saved = localStorage.getItem('app_theme');
      if (saved === 'dark') document.documentElement.classList.add('dark');
      if (saved === 'light') document.documentElement.classList.remove('dark');
    })();
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-950/80 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">

      <!-- Marca -->
      <a href="<?= scriptUrl ?>" class="flex items-center gap-3 shrink-0">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 text-white font-display font-bold text-lg shadow-md shadow-brand-500/30">
          <?= (typeof CONFIG !== 'undefined' ? CONFIG.APP_NAME : 'App').charAt(0) ?>
        </span>
        <span class="leading-tight">
          <span class="block font-display font-semibold text-slate-900 dark:text-white">
            <?= typeof CONFIG !== 'undefined' ? CONFIG.APP_NAME : 'MiApp' ?>
          </span>
          <span class="block text-xs text-slate-500 dark:text-slate-400">
            <?= typeof CONFIG !== 'undefined' ? CONFIG.APP_TAGLINE : '' ?>
          </span>
        </span>
      </a>

      <!-- Acciones -->
      <div class="flex items-center gap-2">
        <button id="themeToggle" type="button" title="Cambiar tema"
          class="flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <svg id="iconSun" class="h-4.5 w-4.5 hidden dark:block" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg id="iconMoon" class="h-4.5 w-4.5 block dark:hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        </button>
      </div>

    </div>
  </header>

  <!-- CONTENIDO -->
  <main>
    <?!= content ?>
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-slate-200 dark:border-slate-800 mt-16">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 text-center text-xs text-slate-400 dark:text-slate-500">
      <?= typeof CONFIG !== 'undefined' ? CONFIG.APP_NAME : 'MiApp' ?> · construido con el Framework MVC para Google Apps Script
    </div>
  </footer>

  <script>
    (function() {
      var toggle = document.getElementById('themeToggle');
      if (!toggle) return;
      toggle.addEventListener('click', function() {
        var isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('app_theme', isDark ? 'dark' : 'light');
        if (window.google && google.script && google.script.run && google.script.run.withSuccessHandler) {
          google.script.run.setTheme(isDark ? 'dark' : 'light');
        }
      });
    })();
  </script>

</body>
</html>
